name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release calls this workflow before it builds anything, so a tag can never
  # publish an image these checks have not passed. Tags are deliberately NOT a
  # `push` trigger: that would run this twice for every release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pulshealth-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate server and web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: |
            server/api/go.sum
            server/ingest/go.sum
            server/mcp/go.sum

      - name: Validate Go services
        shell: bash
        run: |
          set -euo pipefail
          # tools/puls-export is the CLI for the product API's /v1/export; it
          # has no dependencies, so it carries no go.sum to cache above.
          for module in server/ingest server/api server/mcp tools/puls-export; do
            (
              cd "$module"
              go mod verify
              # gofmt has no check mode: it lists what it would change, so a
              # non-empty listing is the failure.
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then
                echo "not gofmt-clean in $module:" >&2
                echo "$unformatted" >&2
                exit 1
              fi
              go vet ./...
              go test -race -count=1 ./...
            )
          done

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate web
        working-directory: web
        run: |
          npm ci
          npm run check:catalog
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Check the app's bundled knowledge base
        # PulsHealth/Sources/Resources/knowledge.json is rendered from
        # knowledge-base/**/*.yaml by scripts/gen-knowledge-json.py and
        # checked in (the app has no YAML parser). Fails when the YAML or
        # the generator changed without the JSON being regenerated.
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/check-knowledge-json.sh

      - name: Validate Compose, workflows and shell scripts
        env:
          # Validation-only placeholders: `docker compose config` refuses to
          # render without the `${VAR:?}` secrets. Nothing is started.
          POSTGRES_PASSWORD: validation-only
          PULS_TOKEN: validation-only
          PULS_API_TOKEN: validation-only
          GRAFANA_PASSWORD: validation-only
          GRAFANA_DB_PASSWORD: validation-only
          API_DB_PASSWORD: validation-only
          INGEST_DB_PASSWORD: validation-only
          PULS_MCP_TOKEN: validation-only
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          # Every way the stack is run: pulling the published images, the
          # developer overlay that builds them from the checkout, and the
          # opt-in `backup` and `tunnel` profiles (which a plain `up -d` never
          # starts, so nothing else would render them).
          docker compose -f server/docker-compose.yml config --quiet
          docker compose -f server/docker-compose.yml -f server/compose.build.yml config --quiet
          docker compose -f server/docker-compose.yml --profile backup config --quiet
          docker compose -f server/docker-compose.yml --profile tunnel config --quiet
          scripts=(server/db/migrate.sh server/db/migrations/*.sh server/backup/*.sh scripts/*.sh)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck "${scripts[@]}"

  # The pulshealth.com marketing site (site/), which is a static export and
  # nothing to do with web/, the self-hosted viewer. It is its own job because
  # it is the one thing here built with bun, and because it must not gate the
  # server on an unrelated site change.
  site:
    name: Marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        # Not on the runner image, unlike node and go.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - name: Validate the marketing site
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build

      - name: Check the export is complete
        shell: bash
        run: |
          set -euo pipefail
          # site/ reads knowledge-base/, blog/ and the documentation manifest's
          # markdown files as repository-root siblings, by relative path
          # (src/lib/api.ts, src/lib/blog.ts, src/lib/docs.ts). Break that and
          # the loaders log and return nothing: the build still SUCCEEDS, it
          # just exports far fewer pages. So assert the counts.
          types=$(git ls-files 'knowledge-base/*/**.yaml' | wc -l)
          built=$(find site/out/knowledge-base/types -name index.html | wc -l)
          posts=$(git ls-files 'blog/articles/*.mdx' | wc -l)
          blogs=$(find site/out/blog -mindepth 1 -maxdepth 1 -type d | wc -l)
          # The docs manifest (DOCS in site/src/lib/docs.ts) is explicit, not
          # a glob, so its length is a constant: bump it with the manifest.
          manifest=11
          docs=$(find site/out/docs -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "knowledge-base types: $types sources, $built pages"
          echo "blog articles: $posts sources, $blogs pages"
          echo "documentation: $manifest manifest entries, $docs pages"
          test "$built" -eq "$types"
          test "$blogs" -eq "$posts"
          test "$docs" -eq "$manifest"
          test -f site/out/index.html
          test -f site/out/docs/index.html
          test -f site/out/sitemap.xml
          # llms.txt is rendered from the repository root's llms.txt by
          # site/scripts/gen-llms-txt.ts (prebuild), never copied by hand.
          test -f site/out/llms.txt
          grep -q 'https://pulshealth.com/docs/protocol/' site/out/llms.txt

  # The four app images build for linux/amd64 (no push) so a broken
  # Dockerfile fails a pull request instead of the next release. Same
  # contexts and build args as .github/workflows/release.yml and
  # server/compose.build.yml — keep the three in step.
  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ingest
            context: server/ingest
          - image: api
            context: server/api
          - image: mcp
            context: server/mcp
          - image: web
            context: web
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }} (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: pulshealth-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-linux-amd64

  # The protocol corpus: every fixture in docs/protocol/fixtures must validate
  # against the JSON Schemas in docs/protocol/schema, and the Python reference
  # receiver must accept the corpus with the expected counts. Both fail when
  # the wire format changes on one side only.
  protocol:
    name: Protocol schemas, fixtures and reference receiver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: tools/protocol-check/go.sum

      - name: Validate the fixture corpus against the schemas
        working-directory: tools/protocol-check
        run: |
          go mod verify
          go vet ./...
          go test -race -count=1 ./...
          go run . ../../docs/protocol/fixtures/*.ndjson

      - name: Smoke-test the Python reference receiver with the corpus
        run: python3 examples/receivers/python-sqlite/smoke_test.py

  # The schema path a self-hoster takes, end to end: server/db/migrate.sh
  # against a throwaway TimescaleDB — fresh (every file applied), again (every
  # file skipped), then the pre-migrate-database case with schema_migrations
  # dropped: the run must refuse, `baseline` must record every file, the next
  # run applies only the re-runnable files and the one after that is a no-op;
  # an edited applied file is refused. migrate.sh runs inside the same image
  # the compose `migrate` service uses, so nothing depends on the runner's psql.
  db-migrate:
    name: Schema migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start a throwaway TimescaleDB
        run: |
          # The exact image the compose stack pins (x-db-image), so this job
          # tests the TimescaleDB a self-hoster actually gets.
          DB_IMAGE=$(grep -oE -m1 'timescale/timescaledb-ha:[A-Za-z0-9._-]+' server/docker-compose.yml)
          echo "DB_IMAGE=$DB_IMAGE" >> "$GITHUB_ENV"
          echo "using $DB_IMAGE"
          docker network create puls-ci
          docker run -d --name puls-ci-db --network puls-ci \
            -e POSTGRES_PASSWORD=ci-secret "$DB_IMAGE"
          for _ in $(seq 1 60); do
            if docker exec puls-ci-db pg_isready -h 127.0.0.1 -U postgres -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "database did not become ready" >&2
          docker logs puls-ci-db
          exit 1

      - name: Run the migration scenario
        shell: bash
        run: |
          set -euo pipefail
          migrate() {
            docker run --rm --network puls-ci \
              -v "$PWD/server/db/migrate.sh:/puls/migrate.sh:ro" \
              -v "${MIGRATIONS_SRC:-$PWD/server/db/migrations}:/puls/migrations:ro" \
              -e PGHOST=puls-ci-db -e PGPASSWORD=ci-secret -e MIGRATIONS_DIR=/puls/migrations \
              -e GRAFANA_DB_PASSWORD=ci-grafana -e API_DB_PASSWORD=ci-api \
              -e INGEST_DB_PASSWORD=ci-ingest -e WEB_DB_PASSWORD=ci-web \
              -e PULS_TIME_ZONE=Europe/Berlin \
              --entrypoint bash "$DB_IMAGE" /puls/migrate.sh "$@"
          }
          sql() {
            docker exec puls-ci-db psql -U postgres -d postgres -tA -v ON_ERROR_STOP=1 -c "$1"
          }
          # expect <summary substring> [migrate args...]: run migrate, print its
          # last summary line, fail unless the output carries the substring.
          expect() {
            local want=$1 out status=0; shift
            out=$(migrate "$@" 2>&1) || status=$?
            if [ "$status" -ne 0 ]; then
              echo "migrate exited with status $status:"; echo "$out"; exit 1
            fi
            grep '^migrate: ' <<<"$out" | tail -n 1
            grep -qF -- "$want" <<<"$out" || { echo "expected: $want"; echo "$out"; exit 1; }
          }
          sql_files=(server/db/migrations/*.sql)
          sh_files=(server/db/migrations/*.sh)
          sqls=${#sql_files[@]}
          shs=${#sh_files[@]}
          reruns=$( (grep -lx -- '-- puls:rerun' server/db/migrations/*.sql || true) | wc -l | tr -d ' ')

          echo "::group::fresh database: every file applied"
          expect "$sqls applied, 0 rerun, 0 skipped, $shs script(s) ran"
          echo "::endgroup::"
          echo "::group::second run: every file skipped"
          expect "0 applied, 0 rerun, $sqls skipped, $shs script(s) ran"
          echo "::endgroup::"
          echo "::group::a database from before the migrate service: refused until baselined"
          sql "DROP TABLE schema_migrations"
          if migrate; then echo "migrate must refuse a database without schema_migrations"; exit 1; fi
          expect "baseline complete: $sqls file(s) recorded" baseline
          test "$(sql 'SELECT count(*) FROM schema_migrations')" -eq "$sqls"
          echo "::endgroup::"
          echo "::group::after baseline: only the re-runnable files are applied, then nothing"
          expect "0 applied, $reruns rerun, $((sqls - reruns)) skipped, $shs script(s) ran"
          expect "0 applied, 0 rerun, $sqls skipped, $shs script(s) ran"
          echo "::endgroup::"
          echo "::group::an edited applied file is refused"
          cp -R server/db/migrations /tmp/edited
          echo "-- edited" >> /tmp/edited/001_schema.sql
          if MIGRATIONS_SRC=/tmp/edited migrate; then echo "an edited applied file must be refused"; exit 1; fi
          echo "::endgroup::"
          echo "::group::schema assertions"
          test "$(sql 'SELECT puls_time_zone()')" = "Europe/Berlin"
          sql 'SELECT count(*) FROM metric_daily'
          test "$(sql 'SELECT count(*) FROM category_labels')" -gt 0
          test "$(sql "SELECT string_agg(rolname, ',' ORDER BY rolname) FROM pg_roles WHERE rolname IN ('grafana','api_reader','ingest')")" = "api_reader,grafana,ingest"
          # The web viewer's accounts-mode role (WEB_DB_PASSWORD), with the
          # per-user views first on its search_path; its isolation is proven
          # by web/lib/webapp.integration.test.ts in db-integration.
          test "$(sql "SELECT rolcanlogin::text || ' ' || array_to_string(rolconfig, ';') FROM pg_roles WHERE rolname = 'web_app'")" = "true search_path=web, public"
          echo "::endgroup::"

      - name: Remove the throwaway database
        if: always()
        run: |
          docker rm -f puls-ci-db >/dev/null 2>&1 || true
          docker network rm puls-ci >/dev/null 2>&1 || true

  # The suites that need a real database. Every `Integration` test in
  # server/ingest and server/api skips itself when DATABASE_URL is unset, so
  # until this job existed not one of them ran anywhere — including
  # TestIntegration_DeletionsOnCompressedChunk, which is the named guard for
  # the compressed-chunk deletion rule (a bare `uuid` predicate trips
  # TimescaleDB's decompression limit and stalls sync). The schema is applied
  # by server/db/migrate.sh against the pinned TimescaleDB, the same path a
  # self-hoster takes, and each suite connects as the scoped role it uses in
  # production — `ingest` writes, `api_reader` reads, `web_app` reads one
  # user at a time — with ADMIN_DATABASE_URL
  # for the few steps those roles are deliberately not allowed to perform
  # (applying DDL, compress_chunk, inserting fixtures). Running the suites as
  # the superuser instead would pass while a real deployment 500s on a
  # missing grant.
  db-integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # America/Los_Angeles, where db-migrate uses Europe/Berlin, because the
      # API's day-range fixtures were written against LA dates and
      # metric_daily buckets in puls_time_zone(): the database's zone and the
      # fixtures' must agree or server-computed days land on the wrong row.
      PULS_TIME_ZONE: America/Los_Angeles
      # 55432, not 5432: the runner image ships a PostgreSQL of its own.
      ADMIN_DATABASE_URL: postgres://postgres:ci-secret@127.0.0.1:55432/postgres
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: |
            server/api/go.sum
            server/ingest/go.sum

      - name: Start a throwaway TimescaleDB and apply the schema
        shell: bash
        run: |
          set -euo pipefail
          # The exact image the compose stack pins (x-db-image), so the tests
          # run against the TimescaleDB a self-hoster actually gets.
          DB_IMAGE=$(grep -oE -m1 'timescale/timescaledb-ha:[A-Za-z0-9._-]+' server/docker-compose.yml)
          echo "using $DB_IMAGE"
          docker network create puls-integration
          docker run -d --name puls-integration-db --network puls-integration \
            -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=ci-secret "$DB_IMAGE"
          ready=
          for _ in $(seq 1 60); do
            if docker exec puls-integration-db pg_isready -h 127.0.0.1 -U postgres -d postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "database did not become ready" >&2
            docker logs puls-integration-db
            exit 1
          fi
          # The real migrator, in the database image, exactly as the compose
          # `migrate` service runs it — 099_read_roles.sh included, since it
          # creates the scoped roles the two test steps then connect as.
          docker run --rm --network puls-integration \
            -v "$PWD/server/db/migrate.sh:/puls/migrate.sh:ro" \
            -v "$PWD/server/db/migrations:/puls/migrations:ro" \
            -e PGHOST=puls-integration-db -e PGPASSWORD=ci-secret -e MIGRATIONS_DIR=/puls/migrations \
            -e GRAFANA_DB_PASSWORD=ci-grafana -e API_DB_PASSWORD=ci-api \
            -e INGEST_DB_PASSWORD=ci-ingest -e WEB_DB_PASSWORD=ci-web \
            -e PULS_TIME_ZONE="$PULS_TIME_ZONE" \
            --entrypoint bash "$DB_IMAGE" /puls/migrate.sh

      - name: Ingest, as the scoped `ingest` role
        working-directory: server/ingest
        env:
          DATABASE_URL: postgres://ingest:ci-ingest@127.0.0.1:55432/postgres
        run: go test -race -count=1 -run Integration ./...

      - name: Product API, as the read-only `api_reader` role
        working-directory: server/api
        env:
          DATABASE_URL: postgres://api_reader:ci-api@127.0.0.1:55432/postgres
          # Opt-in because they write: fixture rows go in through
          # ADMIN_DATABASE_URL and are read back through the reader role, so
          # the grants under test are the ones production uses.
          PULS_API_WRITE_INTEGRATION_TESTS: "1"
        run: go test -race -count=1 -run Integration ./...

      # The web viewer's accounts mode reads through the web_app role, which
      # may see health data only through the per-user views in schema `web`
      # (015_web_accounts.sql). The test seeds two users as the superuser —
      # compressing the old half of each hypertable — and proves, as web_app,
      # that a transaction scoped to one user reads only that user's rows,
      # an unscoped one reads nothing, and nothing beneath the views is
      # reachable. accounts.integration.test.ts then drives accounts mode
      # through the viewer's own route handlers and proxy: invite, sign-in,
      # a scoped read, password change, sign-out, throttling. Last of the
      # suites on this database, so their fixtures cannot disturb the Go
      # tests' counts.
      - name: Set up Node for the web viewer
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web viewer, as the per-user `web_app` role
        working-directory: web
        env:
          WEB_APP_DATABASE_URL: postgres://web_app:ci-web@127.0.0.1:55432/postgres
          # The test throws instead of skipping when this is set without both URLs.
          PULS_WEB_INTEGRATION: "1"
        run: |
          npm ci
          npx vitest run lib/webapp.integration.test.ts lib/accounts.integration.test.ts

      # The exploration notebook, executed end to end against a seeded schema.
      # The test brings up its own throwaway TimescaleDB (the same pinned
      # image, already pulled above) on a random loopback port, applies the
      # schema with server/db/migrate.sh through the runner's psql, seeds a
      # few HealthKit rows and runs every cell with nbclient — so it never
      # touches the database the Go suites used. About half a minute.
      - name: Set up Python for the notebook test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: notebooks/requirements.txt

      - name: Execute the exploration notebook against a seeded schema
        run: |
          python -m pip install --quiet -r notebooks/requirements.txt
          python -m pytest tests/test_healthkit_notebook.py -rs

      - name: Remove the throwaway database
        if: always()
        run: |
          docker rm -f puls-integration-db >/dev/null 2>&1 || true
          docker network rm puls-integration >/dev/null 2>&1 || true

  # The public-tree gate: no tracked file may carry owner-specific or
  # private-infrastructure content (tailnet hostnames, personal mailboxes,
  # home directories, an Apple Team ID, the retired private deploy tooling).
  # Patterns are identifier classes, never literal values — see the script.
  public-tree:
    name: Public tree gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for private content
        run: scripts/check-public-tree.sh
