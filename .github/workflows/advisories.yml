# Upstream advisories are reported here, visibly red, and this workflow is
# meant to stay OUT of any required-status-check list: a new advisory in a
# transitive npm, bun or Go dependency must not block an unrelated fix from
# merging. Treat a red run as a prompt to bump the dependency in its own PR —
# usually the one Dependabot has already opened (.github/dependabot.yml).
#
# It lives in its own file rather than in ci.yml because release.yml now calls
# ci.yml before it builds anything: a job that is *designed* to go red would
# otherwise block every release, which is the opposite of non-blocking.
#
# The schedule is the load-bearing trigger — an advisory is published against
# code that has not changed, so a repository with no commits this week still
# needs to hear about it. Which is also why this does not run on every push.
# A red run here reports the state of the dependency tree, not the state of the
# commit that happened to trigger it: the same finding is still true tomorrow,
# and it stays true until an upstream release exists to bump to. Re-running it
# per push re-reports one standing fact, and GitHub mails a failure notice each
# time, which buries the CI failures that *are* about the commit. So the push
# trigger is gone and the pull_request one is scoped to the files that can
# actually change the answer: the lockfiles, and this workflow itself.
name: Advisories

on:
  pull_request:
    paths:
      - "**/package-lock.json"
      - "**/bun.lock"
      - "**/go.sum"
      - ".github/workflows/advisories.yml"
  schedule:
    # Mondays, a little before Dependabot's weekly run.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulshealth-advisories-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  advisories:
    name: Dependency advisories (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: |
            server/api/go.sum
            server/ingest/go.sum
            server/mcp/go.sum
            tools/protocol-check/go.sum

      # Every step below runs even when an earlier one is red, so one noisy
      # ecosystem cannot hide the other two. The job still ends red if any
      # of them failed.
      - name: govulncheck
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          # All five modules, not just the three services. protocol-check is
          # the one with a third-party dependency tree, and the one CI runs
          # against the fixture corpus; puls-export is stdlib-only, so what it
          # reports is the Go toolchain's own advisories.
          for module in server/ingest server/api server/mcp \
                        tools/puls-export tools/protocol-check; do
            (cd "$module" && "$(go env GOPATH)/bin/govulncheck" ./...)
          done

      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm audit (web)
        if: ${{ !cancelled() }}
        working-directory: web
        run: |
          # Dev dependencies are in scope: they execute on this runner, in the
          # same repository that publishes images to GHCR.
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Set up bun
        if: ${{ !cancelled() }}
        # Not on the runner image, unlike node and go.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - name: bun audit (site)
        if: ${{ !cancelled() }}
        working-directory: site
        run: |
          # site/ ships js-yaml as a production dependency — it parses all 178
          # knowledge-base files — and was previously audited nowhere.
          bun install --frozen-lockfile
          bun audit --audit-level=high
