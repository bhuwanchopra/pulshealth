# Publishes the four app images — ghcr.io/pulshealth/{ingest,api,mcp,web} —
# for linux/amd64 and linux/arm64, on every `v*` tag and on demand.
#
# Tags on a `v1.2.3` push: 1.2.3, 1.2, latest (latest and the major.minor
# tag only for a non-prerelease semver tag, so v1.3.0-rc1 publishes 1.3.0-rc1
# and nothing floats onto it). A workflow_dispatch run publishes the `tag`
# input, or the short commit SHA when it is empty — the way to publish a
# branch's images without cutting a release (and, on a fork with no `v*` tag
# yet, the only images there are to pull). Never `latest`, so a manual run
# cannot move installs that track it.
#
# Each platform builds natively — ubuntu-24.04 for amd64, ubuntu-24.04-arm for
# arm64 — and pushes by digest; a merge job per image then assembles the
# multi-arch manifest list with `docker buildx imagetools create`. QEMU was
# rejected: emulating the Next.js production build (web) on amd64 takes tens
# of minutes and is the flakiest thing in an otherwise boring pipeline, while
# the native arm64 runners are free for public repositories.
#
# The image matrix here, the `images` job in ci.yml and server/compose.build.yml
# must agree on contexts and build args.
#
# Maintainer notes: a package first created by this workflow is private
# until its visibility is flipped to public once, in the package settings on
# GitHub (Packages → <name> → Package settings → Change visibility); and the
# `latest` tag exists only after the first `v*` tag, so until then a compose
# install must set PULS_VERSION to a dispatched tag or build with `make dev-up`.

name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: the short commit SHA). Never `latest`."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: pulshealth-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/pulshealth

jobs:
  version:
    name: Resolve the version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The exact tag every image gets (1.2.3 for v1.2.3; the input or the
      # short SHA on dispatch); the floating tags are decided in metadata.
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - name: Resolve
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == v* ]]; then
            version=${REF_NAME#v}
            is_release=true
          elif [ -n "$INPUT_TAG" ]; then
            version=$INPUT_TAG
            is_release=false
          else
            version=${SHA:0:7}
            is_release=false
          fi
          if [ "$version" = latest ]; then
            echo "refusing to publish 'latest' by hand; it is reserved for v* tags" >&2
            exit 1
          fi
          case $version in
            *[!A-Za-z0-9._-]*|.*|-*) echo "'$version' is not a valid image tag" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "publishing version $version (release: $is_release)"

  # ci.yml does not trigger on tags, so before this job existed a `git push
  # --tags` published four images — and moved `latest`, which every unpinned
  # self-hoster runs — without a single test having run against that commit.
  # Calling the workflow (rather than trusting a check-suite lookup) also means
  # the tagged tree itself is tested, not whatever main happened to be.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [ingest, api, mcp, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: ingest
            context: server/ingest
          - image: api
            context: server/api
          - image: mcp
            context: server/mcp
          - image: web
            context: web
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the platform for the digest artifact
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Image metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=pulshealth-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed untagged; the merge job names the manifest list.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          provenance: false

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }} manifest
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Provenance is attested here rather than in `build`, where buildkit's
      # own `provenance:` would add attestation manifests to the per-platform
      # digests the merge step globs — which is why that stays false. Attesting
      # the finished manifest list instead gives a consumer one thing to check:
      #   gh attestation verify oci://ghcr.io/pulshealth/<image>:<tag> \
      #     --repo PulsHealth/pulshealth
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [ingest, api, mcp, web]
    steps:
      - name: Download the per-platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          # `latest` comes from the semver type (non-prerelease tags only),
          # never from a dispatch; the raw type carries the dispatched tag.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_release == 'false' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          test -n "$tags"
          digests=$(printf "$IMAGE@sha256:%s " *)
          # shellcheck disable=SC2086 # word-split on purpose: -t flags and digests
          docker buildx imagetools create $tags $digests

      - name: Inspect the result
        id: inspect
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case $digest in
            sha256:*) ;;
            *) echo "could not read the manifest-list digest: '$digest'" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
