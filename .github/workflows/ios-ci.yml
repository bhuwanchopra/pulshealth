name: Validate PulsHealth iOS

on:
  push:
    branches: [main]
    paths:
      - "PulsHealth/**"
      - "PulsHealthSync/**"
      # The package tests compare this file byte for byte with the catalog.
      - "docs/protocol/catalog.json"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "PulsHealth/**"
      - "PulsHealthSync/**"
      - "docs/protocol/catalog.json"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: pulshealth-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test iOS (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SDK the app has been tested against since 1.4.
          - runner: macos-26
            xcode: "26.5"
            os: "26.5"
          # The SDK store archives are built with since 1.6: the same Xcode
          # 27.0 (27A266a) the maintainer archives with. The xcode-27 image
          # is a public preview, arm64 only.
          - runner: xcode-27
            xcode: "27.0"
            os: "27.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Test sync package
        working-directory: PulsHealthSync
        run: |
          xcodebuild test \
            -scheme PulsHealthSync \
            -destination 'platform=iOS Simulator,OS=${{ matrix.os }},name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate the Xcode project
        # PulsHealth.xcodeproj is generated and gitignored: XcodeGen copies
        # DEVELOPMENT_TEAM from Config/Local.xcconfig into the pbxproj, so a
        # tracked project would leak the maintainer's Team ID on every
        # regeneration. project.yml's preGenCommand seeds Local.xcconfig from
        # the tracked example; the empty template is enough for the simulator.
        working-directory: PulsHealth
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and run app-hosted tests
        working-directory: PulsHealth
        run: |
          xcodebuild test \
            -scheme PulsHealth \
            -destination 'platform=iOS Simulator,OS=${{ matrix.os }},name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
