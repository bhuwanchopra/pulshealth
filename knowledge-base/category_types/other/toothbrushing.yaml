description: |
  ## Overview

  HKCategoryTypeIdentifierToothbrushingEvent captures discrete toothbrushing events in HealthKit. Each sample
  represents a single brushing session, recording when the brushing started and ended. The duration is
  calculated from the sample's start and end dates, providing insight into brushing habits and compliance
  with dental hygiene recommendations.

  ## Health Significance

  Oral health is increasingly recognized as connected to systemic health. Poor oral hygiene is associated
  with:

  - **Cardiovascular disease**: Periodontal bacteria may contribute to atherosclerosis
  - **Diabetes management**: Gum disease can affect blood glucose control
  - **Respiratory infections**: Oral bacteria can be aspirated into lungs
  - **Pregnancy outcomes**: Periodontal disease linked to preterm birth
  - **Cognitive health**: Emerging research links oral health to dementia risk

  Tracking brushing frequency and duration helps establish baseline hygiene habits and identify patients
  who may benefit from oral health interventions.

  ## Clinical Interpretation

  When reviewing toothbrushing data, clinicians should consider:

  - **Frequency**: The American Dental Association recommends brushing twice daily. Less frequent brushing
    may indicate poor compliance or need for patient education.

  - **Duration**: Each session should last approximately 2 minutes (120 seconds). Consistently short
    sessions may result in inadequate plaque removal.

  - **Timing patterns**: Morning and evening brushing (especially before bed) is most effective. Brushing
    after meals can help but should wait 30 minutes after acidic foods.

  - **Consistency**: Regular daily patterns suggest established habits; sporadic entries may indicate
    incomplete tracking or inconsistent hygiene practices.

  ## Caveats & Limitations

  - **Data completeness**: Users may not consistently log brushing events, especially if manually entered.
    Smart toothbrush data is more reliable but requires compatible devices.

  - **Quality not captured**: The data records that brushing occurred but not the technique, coverage, or
    effectiveness. Proper brushing technique matters as much as duration.

  - **Device accuracy**: Motion-based detection (like Apple Watch) may have false positives or miss
    events. Smart toothbrush data depends on Bluetooth connectivity.

  - **Single value category**: All samples use value 0 (notApplicable) - the meaningful data is in the
    timestamp and duration, not the category value itself.

  - **Supplementary hygiene not tracked**: Flossing, mouthwash use, and interdental cleaning are not
    captured by this type.
