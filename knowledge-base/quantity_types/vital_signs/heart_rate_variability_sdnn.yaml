# ============================================
# HEALTHKIT DATA TYPE: Heart Rate Variability SDNN
# ============================================

# --- CORE IDENTIFICATION ---
identifier: "HKQuantityTypeIdentifierHeartRateVariabilitySDNN"
source: "HealthKit"
type: "HKQuantityType"
category: "Vital Signs"
human_readable_name: "Heart Rate Variability (SDNN)"
short_description: "Measures the standard deviation of normal-to-normal heartbeat intervals, reflecting autonomic nervous system function and overall physiological resilience."

# --- APPLE HEALTH UI ---
icon: "waveform.path.ecg"
color: "#FF2D55"

# --- UNITS & MEASUREMENT ---
default_unit: "ms"
supported_units:
  - "ms"
  - "s"
unit_description: "Milliseconds - represents the standard deviation of the time intervals between consecutive heartbeats (NN intervals)"

# --- STATISTICS ---
aggregation_type: "discrete"
statistics_options:
  - "discreteAverage"
  - "discreteMin"
  - "discreteMax"
  - "separateBySource"
  - "mostRecent"

# --- TYPICAL VALUES ---
typical_range:
  min: 10
  max: 200
  unit: "ms"
  notes: "Apple Watch typically reports short-term SDNN measurements (not 24-hour SDNN). Values vary dramatically by age, fitness, and measurement duration. Context is critical for interpretation."

clinical_ranges:
  - population: "Adults (short-term measurement, ~1-5 minutes)"
    normal: "20-70 ms"
    low: "<20 ms (reduced variability, may indicate autonomic dysfunction)"
    high: ">70 ms (excellent variability, often seen in fit individuals)"
  - population: "Adults (24-hour Holter SDNN - clinical standard)"
    normal: "100-180 ms"
    low: "<70 ms (moderate risk)"
    high: ">180 ms (generally favorable)"
  - population: "Post-MI patients (24-hour SDNN - clinical threshold)"
    normal: ">100 ms"
    low: "<70 ms (moderate mortality risk); SDNN <50 ms associated with 5-fold increased mortality risk post-MI"
  - population: "Healthy young adults (overnight)"
    normal: "100-200 ms"
    low: "<100 ms"
    high: ">200 ms (excellent parasympathetic function)"
  - population: "Older adults (65+)"
    normal: "50-100 ms"
    low: "<50 ms"
    high: ">100 ms"
  - population: "Athletes"
    normal: "Often >100 ms even in short recordings"
    low: "Significant drop from baseline may indicate overtraining"

