# --- DATA SOURCES ---
devices:
  - name: "Apple Watch"
    capability: "Calculates SDNN from beat-to-beat intervals detected by optical PPG sensor. Typically measures during periods of rest, often overnight or during Breathe/Mindfulness sessions. Measurement duration is usually short-term (1-5 minutes)."
    series: "Series 1 and later"
    accuracy: "Optical sensors are less precise than ECG for beat detection, but adequate for population-level HRV assessment"
  - name: "iPhone"
    capability: "Displays HRV data but cannot measure directly without external sensor"
  - name: "Chest strap heart rate monitors"
    capability: "ECG-based chest straps provide more accurate beat detection for HRV measurement"
