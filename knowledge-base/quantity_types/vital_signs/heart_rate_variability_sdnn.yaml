# --- RELATED TYPES ---
related_types:
  - identifier: "HKQuantityTypeIdentifierHeartRate"
    relationship: "Source data - HRV is calculated from beat-to-beat intervals derived from heart rate data"
  - identifier: "HKQuantityTypeIdentifierHeartRateVariabilityRMSSD"
    relationship: "Sibling HRV type (iOS 27+, shown as Recovery HRV) - RMSSD reflects beat-to-beat, vagally mediated variability and stays stable over short windows; not interchangeable with SDNN"
  - identifier: "HKQuantityTypeIdentifierRestingHeartRate"
    relationship: "Correlated - Lower resting HR often correlates with higher HRV (both reflect parasympathetic tone)"
  - identifier: "HKQuantityTypeIdentifierHeartRateRecoveryOneMinute"
    relationship: "Complementary - Both assess autonomic function; good HR recovery often correlates with higher HRV"
  - identifier: "HKQuantityTypeIdentifierVO2Max"
    relationship: "Correlated - Higher cardiovascular fitness (VO2max) often associated with higher HRV"
  - identifier: "HKCategoryTypeIdentifierSleepAnalysis"
    relationship: "Context - Sleep quality significantly affects HRV; poor sleep reduces HRV"
  - identifier: "HKCategoryTypeIdentifierMindfulSession"
    relationship: "Measurement context - HRV often measured during Breathe/Mindfulness sessions"
  - identifier: "HKQuantityTypeIdentifierRespiratoryRate"
    relationship: "Influence factor - Breathing rate affects short-term HRV measurements"

