# --- KNOWLEDGE BASE METADATA ---
last_updated: "2026-10-02"
research_notes: |
  - Availability: Apple's documentation JSON lists iOS, iPadOS, Mac Catalyst, macOS, visionOS and watchOS 27.0. The Xcode 27 SDK header (HKTypeIdentifiers.h) declares API_AVAILABLE(ios(27.0), watchos(27.0), macCatalyst(27.0), macos(27.0), visionos(27.0)) with the comment "ms, Discrete (Arithmetic)". As of 2026-10-02 the documentation page is a bare declaration with no discussion.
  - Verified on the iOS 27.0 simulator runtime (24A434): HKQuantityType(.heartRateVariabilityRMSSD).aggregationStyle is discreteArithmetic, and the type is compatible with ms and s. requestAuthorization(toShare:) passes HealthKit's share-disallowed check for it, while the same check rejects AppleExerciseTime, so third-party apps can write it.
  - The "Recovery HRV" name and the "using the RMSSD formula" wording come from HealthKit's own English strings in that runtime (Localizable-AllDayHRV.strings: HEART_RATE_VARIABILITY_RMSSD = "Recovery HRV"). The same strings still name SDNN "Heart Rate Variability"; "overall HRV" is Apple's wording in the watchOS 27 announcements. Press coverage (Gadgets & Wearables, 2026-09-11) noted Apple had not confirmed the RMSSD/SDNN mapping in its announcements; HealthKit's strings confirm the RMSSD side.
  - Device support (Series 12 and Ultra 4) and the "as often as every five minutes ... 24x" cadence come from Apple Newsroom (2026-09-09). Per-sample window length, algorithm, motion gating and daytime cadence are undocumented, and this file deliberately makes no claim about them. Whether older watches on watchOS 27 write any RMSSD samples is also undocumented. Apple says Recovery HRV needs Series 12 or Ultra 4.
  - Normal values: Nunan 2010 via the table in Shaffer & Ginsberg 2017 (Table 6), Voss 2015 (Tables 3-4, KORA S4, 5-min supine ECG) and the Task Force 1996 24-hour value (27 ± 12 ms). No population norms exist for Apple Watch Recovery HRV. typical_range (10-100 ms) is a display band chosen from these, not a clinical cut-off.
  - The Health app's exact glyph and tint for Recovery HRV were not verified; icon and color mirror the SDNN entry (Heart category).
  - Metadata keys attached to Apple Watch RMSSD samples are undocumented, hence null.
