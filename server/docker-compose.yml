name: pulshealth

# Bounded json-file logs for the application containers. Ingest logs a line
# per batch and every rejection, and nothing else on the host prunes: without
# a cap, a busy month fills the disk that holds the only copy of the data.
# Not applied to `db`: keep the database service definition minimal and
# change it deliberately — Compose recreates the container on any change to
# it (the data volume survives, but treat db edits as their own step).
x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# The PostgreSQL + TimescaleDB image, pinned to an exact tag and shared by the
# db and migrate services so the two can never drift apart. The floating
# `pg17` tag moves TimescaleDB minor versions underneath running installs
# (its internal catalog changed between 2.27 and 2.29), so bumping this is a
# deliberate step — see server/README.md, "Upgrading the database image".
x-db-image: &db-image timescale/timescaledb-ha:pg17.11-ts2.29.2

# The four app services (ingest, api, mcp, web) pull published images from
# ghcr.io/pulshealth/<name>:${PULS_VERSION:-latest} — built by
# .github/workflows/release.yml for linux/amd64 and linux/arm64. To run
# what is in this checkout instead, add the developer overlay, which puts
# the `build:` blocks back:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build
# (`make dev-up` from the repository root). See server/README.md, "Images
# and versions".

services:
  db:
    # Plain PostgreSQL + TimescaleDB. The schema is NOT applied here: the
    # image's own initdb hooks only run on an empty volume, so the `migrate`
    # service below owns the schema and runs on every start instead.
    image: *db-image
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db_data:/home/postgres/pgdata/data
    ports:
      # Localhost only — never exposed beyond the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    # One-shot schema migrator, run before every app service on each
    # `docker compose up -d`: applies pending files from db/migrations/ in
    # order, records them in schema_migrations, re-runs the env-driven role
    # and time-zone scripts, then exits. The app services start only after it
    # exits 0 (service_completed_successfully), so a failed migration stops
    # the stack loudly instead of running new code against an old schema.
    # Same pinned image as db (psql + bash, nothing to build). By hand:
    #   docker compose run --rm migrate            # apply pending migrations
    #   docker compose run --rm migrate baseline   # adopt a pre-existing database
    # See server/README.md, "Schema migrations".
    image: *db-image
    restart: "no"
    logging: *app-logging
    entrypoint: ["bash", "/puls/migrate.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      MIGRATIONS_DIR: /puls/migrations
      # Read by 099_read_roles.sh on every run: creates the grafana,
      # api_reader and ingest roles and rotates their passwords to these.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set in .env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?set in .env}
      # Calendar zone for every daily view (metric_daily, Grafana daily
      # panels, the api's local-day ranges). Must match the phone's zone.
      # 013_time_zone.sh validates it and stores it on the database
      # (ALTER DATABASE … SET) on every run, so changing it later is: edit
      # .env, `docker compose up -d`.
      PULS_TIME_ZONE: ${PULS_TIME_ZONE:-UTC}
    volumes:
      - ./db/migrate.sh:/puls/migrate.sh:ro
      - ./db/migrations:/puls/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  ingest:
    image: ghcr.io/pulshealth/ingest:${PULS_VERSION:-latest}
    restart: unless-stopped
    logging: *app-logging

    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.pulshealth-ingest.rule: "Host(`health.database-dungeon.win`) && PathPrefix(`/ingest`)"
      traefik.http.routers.pulshealth-ingest.entrypoints: "websecure"
      traefik.http.routers.pulshealth-ingest.tls: "true"
      traefik.http.routers.pulshealth-ingest.tls.certresolver: "cf"
      traefik.http.routers.pulshealth-ingest.priority: "100"
      traefik.http.routers.pulshealth-ingest.middlewares: "pulshealth-ingest-strip@docker,secure-headers@file"
      traefik.http.middlewares.pulshealth-ingest-strip.stripprefix.prefixes: "/ingest"
      traefik.http.services.pulshealth-ingest.loadbalancer.server.port: "8080"

    networks:
      - default
      - proxy

    environment:
      # Connects as the scoped DML-only `ingest` role (created and kept
      # current by 099_read_roles.sh from INGEST_DB_PASSWORD) — the only
      # internet-facing service never holds the superuser password. To run
      # as the superuser instead, set INGEST_DB_USER=postgres and
      # INGEST_DB_PASSWORD to the same value as POSTGRES_PASSWORD in .env.
      DATABASE_URL: postgres://${INGEST_DB_USER:-ingest}:${INGEST_DB_PASSWORD:?set in .env}@db:5432/postgres?sslmode=disable
      # The shared bearer token. Optional since per-device tokens exist
      # (`make devices ARGS='issue …'`): leave it empty, or set
      # PULS_ALLOW_SHARED_TOKEN=false, and only device tokens authenticate.
      PULS_TOKEN: ${PULS_TOKEN:-}
      PULS_ALLOW_SHARED_TOKEN: ${PULS_ALLOW_SHARED_TOKEN:-true}
      LISTEN_ADDR: ":8080"
      # Whether to believe X-Forwarded-For when identifying the client an
      # auth-failure budget belongs to. Only true when a proxy that
      # overwrites that header is the ONLY way to reach port 8080 — a
      # reverse proxy or Tailscale Serve/Funnel. Left false (the default),
      # every client is identified by the TCP peer address, which is right
      # for INGEST_BIND_ADDR=0.0.0.0 and for a proxy on the same host that
      # does not rewrite the header. See server/README.md, "Rate limiting".
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      # Loopback by default. Put a TLS-terminating proxy in front of it
      # (reverse proxy, Tailscale Serve/Funnel, VPN) — the phone must reach
      # this port over HTTPS from anywhere beyond the local network.
      # INGEST_BIND_ADDR=0.0.0.0 (what `scripts/bootstrap.sh --lan` sets)
      # publishes it on every interface so a phone on the same Wi-Fi can use
      # plain http://<this host's LAN IP>:8080 with no proxy; the bearer token
      # is then the only protection, and anything else on that network can
      # see the traffic. Never do that on a network you do not control.
      - "${INGEST_BIND_ADDR:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    image: ghcr.io/pulshealth/api:${PULS_VERSION:-latest}
    restart: unless-stopped
    logging: *app-logging
    environment:
      DATABASE_URL: postgres://api_reader:${API_DB_PASSWORD}@db:5432/postgres?sslmode=disable
      PULS_API_TOKEN: ${PULS_API_TOKEN:?set in .env}
      LISTEN_ADDR: ":8081"
      # The user a request is answered for when it names none (the same
      # viewer user as the web container). ?user=<uuid> selects another one
      # only when PULS_MULTI_USER is true; off, any other user is a 403.
      PULS_USER_ID: ${PULS_USER_ID:-5ea4d000-0000-4000-8000-000000000001}
      PULS_MULTI_USER: ${PULS_MULTI_USER:-false}
      # Same calendar zone as the database (see the db service). The api
      # refuses to start on an unknown zone name.
      PULS_TIME_ZONE: ${PULS_TIME_ZONE:-UTC}
      # Whether X-Forwarded-* may be believed: the client an auth failure is
      # charged to, and the host /openapi.json advertises. Same switch and
      # same default as ingest's.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      # Loopback only: expose it through an authenticated HTTPS proxy (e.g.
      # Tailscale Serve). Do not publish the bearer-token surface on the LAN.
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mcp:
    # Read-only MCP server for AI assistants (docs/ai.md). It talks only to
    # the product API over the internal network — never to Postgres — and
    # serves the streamable HTTP transport at /mcp behind PULS_MCP_TOKEN.
    # The same binary runs in stdio mode on a laptop for Claude Desktop,
    # Claude Code or Cursor; this service is the remote-connector path.
    image: ghcr.io/pulshealth/mcp:${PULS_VERSION:-latest}
    restart: unless-stopped
    logging: *app-logging
    environment:
      PULS_API_URL: http://api:8081
      PULS_API_TOKEN: ${PULS_API_TOKEN:?set in .env}
      PULS_MCP_TOKEN: ${PULS_MCP_TOKEN:?set in .env}
      # Every date the tools speak is a calendar day in this zone; the
      # product API does not report its own, so the two must agree.
      PULS_TIME_ZONE: ${PULS_TIME_ZONE:-UTC}
      # Optional: pin this connector to one person. Empty (the default)
      # leaves the choice to each tool call — the API's PULS_USER_ID unless
      # a call names another user, which the API's PULS_MULTI_USER gates.
      # Deliberately not the API's PULS_USER_ID: pinning to that would make
      # the connector unable to read anyone else even with the gate open.
      PULS_USER_ID: ${PULS_MCP_USER_ID:-}
    ports:
      # Loopback only: the token grants read access to the health data, so
      # publish it only through an HTTPS proxy, like the API (e.g.
      # `tailscale serve --bg --https=8445 http://localhost:8082`).
      - "127.0.0.1:8082:8082"
    depends_on:
      - api

  web:
    # Next.js health viewer. Reads Postgres directly over the internal
    # network as the read-only `grafana` role — same data Grafana sees.
    # The developer overlay builds it from the sibling web/ directory
    # (../web relative to this file), so build from a full checkout.
    image: ghcr.io/pulshealth/web:${PULS_VERSION:-latest}
    restart: unless-stopped
    logging: *app-logging
    environment:
      DATABASE_URL: postgres://grafana:${GRAFANA_DB_PASSWORD}@db:5432/postgres?sslmode=disable
      PULS_USER_ID: ${PULS_USER_ID:-5ea4d000-0000-4000-8000-000000000001}
      PULS_TIME_ZONE: ${PULS_TIME_ZONE:-UTC}
      # Set it and every page asks for this password over HTTP Basic (any
      # username; /api/healthz stays open for health checks). Left empty the
      # viewer has no login at all, exactly as before, and says so in its
      # startup log. scripts/bootstrap.sh generates one on a fresh install
      # and prints it. See web/README.md, "Access control".
      WEB_AUTH_PASSWORD: ${WEB_AUTH_PASSWORD:-}
    ports:
      # 3000 is Grafana. Default to loopback; to reach the viewer from other
      # machines set WEB_BIND_ADDR to a private interface, e.g. the host's
      # Tailscale IPv4, rather than 0.0.0.0 — WEB_AUTH_PASSWORD is a password
      # prompt, not TLS, so the bind address still matters.
      - "${WEB_BIND_ADDR:-127.0.0.1}:3001:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  grafana:
    # Pinned: a :latest pull to Grafana 13 silently broke datasource
    # provisioning (legacy top-level `database:` key removed). Bump
    # deliberately and retest the dashboard after upgrades.
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    logging: *app-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      # Recipient of every alert (provisioning/alerting/contact-points.yml).
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-alerts@example.com}
      # Alert delivery. Defaults to off so a deploy never fails on a missing
      # app password: rules still evaluate and the dashboard still turns red,
      # only the email leg is inert. Flip GRAFANA_SMTP_ENABLED to true in .env
      # once GRAFANA_SMTP_PASSWORD holds a Gmail app password (see .env.example).
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-${GRAFANA_SMTP_USER:-}}
      GF_SMTP_FROM_NAME: PulsHealth
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Loopback only, like ingest and the API: this is an admin login whose
      # datasource can read every table including users (name/email/DOB).
      # Reach it from elsewhere through an HTTPS proxy, e.g.
      # `tailscale serve --bg --https=8443 http://localhost:3000`.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    # Opt-in database backups (SRV-9). Behind the `backup` profile, so a plain
    # `docker compose up -d` does not start it and the stack is unchanged for
    # anyone who does not ask:
    #
    #   docker compose --profile backup up -d backup   # scheduled dumps
    #   docker compose run --rm backup once        # one dump now (`make backup`)
    #   docker compose run --rm backup list        # what is in the store
    #
    # Same pinned image as db and migrate, so pg_dump always matches the
    # server version. Restoring is server/backup/restore.sh (`make restore
    # FILE=…`) — read it before you need it. See server/README.md,
    # "Backup & restore".
    image: *db-image
    profiles: ["backup"]
    restart: unless-stopped
    logging: *app-logging
    entrypoint: ["bash", "/puls/backup.sh"]
    # Root so the dump directory is writable whether it is the named volume
    # (created root-owned, since the image has no /backups) or a host
    # directory; the script hands each finished dump to the directory's owner.
    user: root
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      BACKUP_DIR: /backups
      # Time between dumps: 24h, 90m, 3600s or bare seconds. The schedule is
      # relative to when the container started, not to the wall clock — see
      # the note in backup.sh about why this is a sleep loop and not cron.
      PULS_BACKUP_INTERVAL: ${PULS_BACKUP_INTERVAL:-24h}
      # Dumps older than this are deleted after each run; 0 keeps everything.
      # The newest dump is never deleted, however old it is.
      PULS_BACKUP_KEEP_DAYS: ${PULS_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/puls/backup.sh:ro
      # PULS_BACKUP_DIR unset (the default) leaves this as the `backups` named
      # volume below. Set it to a path — an external disk, a NAS mount, an
      # absolute or ./relative directory — and dumps land there instead, which
      # is the only version of this that survives losing the machine.
      - ${PULS_BACKUP_DIR:-backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  grafana_data:
  # Only created when the `backup` profile is used and PULS_BACKUP_DIR is unset.
  backups:

networks:
  proxy:
    external: true
    name: proxy
